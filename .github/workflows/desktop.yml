name: Desktop app

# Builds RipTide Tools for Windows, macOS and Linux and publishes a GitHub Release.
#
# Three ways to release:
# - Raise "version" in desktop/package.json and push to main. If there's no release for that
#   version yet, it's built and published. (Once it's released, pushes only run a quick check.)
# - Push a tag like v0.1.0.
# - Run it from the Actions tab and type the version (leave it empty to only build).
#
# Every release also carries latest.yml, latest-mac.yml and latest-linux.yml. Installed apps
# read these to find the new version and check the download's sha512 before installing it,
# so the version you type becomes the app's version, and must be higher than the last one.
on:
  # Every push to main runs the quick "version" job; the builds only run when that version
  # hasn't been released yet (so a failed release is retried by the next push).
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like v0.1.0. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

# One run at a time; a newer push replaces a run that's still building.
concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  # Works out which version this run is for, and whether it should be published.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.version }}
        run: bash .github/scripts/release-version.sh

  # Pushes that don't release still launch the real Linux app and run its checks, so a change
  # to saving, restoring or updating is tested in the packaged app before any release.
  test-linux:
    needs: version
    if: needs.version.outputs.publish != 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run build
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - name: Build the Linux app (unpacked)
        working-directory: desktop
        run: |
          npm run copy-app
          npx electron-builder --linux dir --publish never
      - name: Test the packaged app (Linux)
        timeout-minutes: 12
        run: xvfb-run -a -s "-screen 0 1920x1080x24" node desktop/test/app.e2e.mjs desktop/release/linux-unpacked/riptide-tools

  build:
    needs: version
    if: needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    env:
      VERSION: ${{ needs.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm test
      - run: npm run build
      - run: npm install --no-audit --no-fund
        working-directory: desktop

      # The app's version comes from the release version, so the update files match it.
      - name: Set the app version
        if: env.VERSION != ''
        shell: bash
        working-directory: desktop
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then echo "Version must look like v0.1.0"; exit 1; fi
          npm pkg set version="${VERSION#v}"

      - name: Build (Windows, Linux)
        if: runner.os != 'macOS'
        run: npm run dist
        working-directory: desktop

      # Launch the real Linux app and check saving, restarts, backups and pop-outs.
      - name: Test the packaged app (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: xvfb-run -a -s "-screen 0 1920x1080x24" node desktop/test/app.e2e.mjs desktop/release/linux-unpacked/riptide-tools

      # No Apple developer certificate yet: build the app, sign it ad hoc so it
      # runs on Apple silicon, then package the signed app into a DMG.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          npm run copy-app
          npx electron-builder --mac --universal --dir --publish never
          codesign --force --deep --sign - "release/mac-universal/RipTide Tools.app"
          npx electron-builder --mac dmg zip --universal --prepackaged "release/mac-universal/RipTide Tools.app" --publish never

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: riptide-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/release/RipTide-*.exe
            desktop/release/RipTide-*.dmg
            desktop/release/RipTide-*.AppImage
            desktop/release/RipTide-*.deb
            desktop/release/RipTide-*.zip
            desktop/release/*.blockmap
            desktop/release/latest*.yml

  release:
    if: needs.version.outputs.publish == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then echo "Version must look like v0.1.0"; exit 1; fi
          ls -la dist
          # Installed apps update from these files: all three must exist and name this version.
          for f in latest.yml latest-mac.yml latest-linux.yml; do
            test -f "dist/$f" || { echo "dist/$f is missing"; exit 1; }
            grep -qx "version: ${TAG#v}" "dist/$f" || { echo "dist/$f doesn't say version ${TAG#v}"; exit 1; }
          done
          cat > notes.md <<'NOTES'
          RipTide Tools for your desktop. Everything is saved as files in a RipTide folder on your computer, works offline, and needs no account.

          | System | Download |
          | --- | --- |
          | Windows 10 and 11 | `RipTide-Windows-Setup.exe` |
          | macOS 12 or newer (Intel and Apple silicon) | `RipTide-macOS.dmg` |
          | Linux | `RipTide-Linux.AppImage` or `RipTide-Linux.deb` |

          These builds aren't code-signed yet, so your system may warn you the first time:
          - **Windows:** on "Windows protected your PC", click **More info**, then **Run anyway**.
          - **macOS:** right-click the app, choose **Open**, then **Open** again. If macOS says it's damaged, run `xattr -cr "/Applications/RipTide Tools.app"` in Terminal.
          - **Linux AppImage:** make it executable (`chmod +x RipTide-Linux.AppImage`), then run it.

          Your data is saved in `Documents/RipTide`. Use **File → Open data folder** to find it.

          **Updates:** once installed, RipTide Tools tells you when a new version is out. Click **Update now** and it closes, installs the update and opens again. (On macOS, keep the app in your Applications folder for this. The other files here are what the app downloads to update itself.)
          NOTES
          # A checksum list so anyone can check a download matches what this build produced.
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          printf '\n**Checking a download:** compare it with `SHA256SUMS.txt` (for example `sha256sum -c SHA256SUMS.txt --ignore-missing`).\n' >> notes.md
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "RipTide Tools $TAG" --notes-file notes.md
